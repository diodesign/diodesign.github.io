title: "About the lab"
subtitle: "Who's behind this place, how, and why"
content: |
  


  <p>Greetings, programs. I'm Chris Williams.</p>
  <p>By day, I'm a technical editor at <a href="https://cloud.google.com/">Google Cloud</a> in San Francisco.</p>
  <p>For fun, I develop <a href="https://diosix.org/">diosix</a>, a RISC-V bare-metal hypervisor I'm rewriting in Zig.</p>
  <p>You can find other programming projects I'm toying with <a href="https://github.com/diodesign?tab=repositories">here</a>. I also like to doodle little fun bits of JavaScript <a href="https://editor.p5js.org/diodesign/sketches">here</a>.</p>
  <p>I am personally interested in open hardware and processor design, novel operating systems and hypervisors, and computer security.</p>
  <p>You can find me on <a href="https://bsky.app/profile/diodesign.org">Bluesky</a>, <a href="https://www.linkedin.com/in/diodesign/">LinkedIn</a>, and <a href="https://keybase.io/diodesign">Keybase</a>.</p>
  <p>Thanks for visiting.</p>
