<article class="container log-section single-entry">
    <header class="page-header">
        <nav class="breadcrumbs">
            {{ breadcrumbs }}
        </nav>
        <time datetime="{{ entry_date }}">{{ entry_date }}</time>
        <h1>{{ entry_title }}</h1>
        <p class="subtitle">By {{ entry_byline }}</p>
    </header>

    <div class="log-content-full">
        {{ entry_content }}
    </div>

    <footer class="entry-footer">
        <nav class="breadcrumbs">
            {{ breadcrumbs }}
        </nav>
    </footer>
</article>
