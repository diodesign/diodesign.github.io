<div class="log-entry">
    <div class="log-meta">
        <time datetime="{{ date }}">{{ date }}</time>
        <p class="byline">By {{ byline }}</p>
        <a href="{{ permalink }}" class="permalink">Permalink</a>
    </div>
    <div class="log-content">
        <h2>{{ title }}</h2>
        {{ content }}
    </div>
</div>
