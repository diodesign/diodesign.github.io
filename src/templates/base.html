<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the diodesign program</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="{{ body_class }}">
    <main>
        {{ body }}
    </main>

    <script>
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            let lastBuildId = null;
            setInterval(async () => {
                try {
                    const res = await fetch('/__livereload', { cache: 'no-store' });
                    if (res.ok) {
                        const buildId = (await res.text()).trim();
                        if (buildId && lastBuildId !== null && buildId !== lastBuildId) {
                            location.reload();
                        }
                        if (buildId) lastBuildId = buildId;
                    }
                } catch (_) {}
            }, 800);
        }
    </script>
</body>

</html>
